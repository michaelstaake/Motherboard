; Store sessions on a persistent volume instead of the container's ephemeral
; /tmp, so logins survive container restarts/rebuilds.
session.save_path = "/var/lib/php/sessions"

; Keep session files for the longest idle timeout Settings > Security allows (1440
; minutes). The app enforces the configured timeout itself; this only stops PHP's
; garbage collector (default 24 minutes) from deleting sessions before then. Set here
; rather than only in index.php so every script sharing this save_path agrees.
session.gc_maxlifetime = 86400
